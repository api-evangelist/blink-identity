name: Blink Identity
description: >-
  Blink Identity is an Austin, Texas company building a privacy-first facial-recognition
  identity platform for live entertainment venues, stadiums, and public spaces. Its
  "identify-in-motion" machine-vision system lets patrons enroll with a smartphone photo,
  then walk through touchless entry, pay-with-your-face concessions, and automatic loyalty
  recognition without stopping to scan a ticket. Facial images are converted into encrypted
  templates rather than stored as photos, and the company is a Techstars Music alumnus that
  has partnered with Live Nation / Ticketmaster on facial-recognition ticketing. This profile
  was surfaced as a Techstars portfolio lead and enriched from the company's public website;
  Blink Identity does not currently publish a developer-facing API, SDK, or documentation surface.
